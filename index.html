    :root{--forest:#183f35;--cream:#f7f4ea;--orange:#dc7848}
    *{box-sizing:border-box}
    body{width:100%;margin:0;color:var(--forest);font-family:"DM Sans",sans-serif}
    .app-shell{width:100%;min-height:100%;background:radial-gradient(circle at 90% 0%,#e3eacb,transparent 38%),var(--cream)}
    h1,h2,h3{font-family:Fraunces,serif;line-height:1.2}
    .card{background:#fffefa;border:1px solid #e3e6d9;border-radius:24px;box-shadow:0 12px 35px #183f350b}

    .btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(.94)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .primary{background:var(--forest);color:#fff}.secondary{background:#e8eee7;color:var(--forest)}
    input:not([type=radio]):not([type=checkbox]),textarea,select{width:100%;border:1px solid #c9d4c9;border-radius:12px;padding:.75rem .85rem;background:#fff;color:var(--forest)}
    input[type=radio],input[type=checkbox]{accent-color:var(--forest)}
    :focus-visible{outline:3px solid var(--orange);outline-offset:3px}
    [hidden]{display:none!important}
    .badge{display:inline-block;border-radius:100px;background:#e7f0e6;padding:6px 12px;font-size:.8rem;font-weight:700}
    .bar{height:9px;background:#dbe3d7;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:var(--orange);transition:width .3s}
    .feedback{border-left:4px solid var(--orange);background:#fff2e9;padding:12px 15px;border-radius:8px}
    .choice{display:block;width:100%;text-align:left;border:1px solid #ccd8cd;border-radius:14px;padding:12px 15px;margin-top:9px;background:#fff;cursor:pointer}
    .choice:hover,.choice.selected{background:#e7f2e9;border-color:var(--forest)}
    .entry{animation:rise .32s ease both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .reading{white-space:pre-line;line-height:1.8}.lesson{padding:1.5rem}
    fieldset{border:0;border-bottom:1px solid #e3e6d9;padding:1.15rem 0}
    .answer{display:flex;gap:.7rem;align-items:flex-start;margin-top:.65rem;padding:.55rem;border-radius:10px;cursor:pointer}
    .answer:hover{background:#eaf1e5}.answer input{margin-top:.32rem}
    @media(min-width:768px){.lesson{padding:2.5rem}}
  </style>

      <p data-template-id="completion-copy" class="canva-text mt-4"></p>
      <p id="completion-score" class="feedback mt-6"></p>
     </section>
     <nav aria-label="Navigasi pelajaran" class="flex justify-between gap-3 mt-7"><button id="back-button" data-template-id="back-label" type="button" class="canva-button btn secondary"></button> <button id="next-button" data-template-id="next-label" type="button" class="canva-button btn primary"></button>
     </nav>
    </div>
    <section id="dashboard" class="entry" hidden>
     <div class="flex flex-wrap justify-between gap-4 mb-6">
      <div>
       <span data-template-id="dashboard-tag" class="canva-tag badge"></span>
       <h1 data-template-id="dashboard-title" class="canva-text mt-3"></h1>
       <p data-template-id="dashboard-warning" class="canva-text mt-2"></p>
      </div><button id="dashboard-back" data-template-id="dashboard-back-label" type="button" class="canva-button btn secondary self-start"></button>
     </div>
     <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div class="card p-4">
       <span data-template-id="total-label" class="canva-text"></span><strong id="total-stat" class="block text-2xl">0</strong>
      </div>
      <div class="card p-4">
       <span data-template-id="active-label" class="canva-text"></span><strong id="active-stat" class="block text-2xl">0</strong>
      </div>
      <div class="card p-4">
       <span data-template-id="finished-label" class="canva-text"></span><strong id="finished-stat" class="block text-2xl">0</strong>
      </div>
      <div class="card p-4">
       <span data-template-id="average-label" class="canva-text"></span><strong id="average-stat" class="block text-2xl">—</strong>
      </div>
     </div>
     <div class="card p-5">
      <div class="grid sm:grid-cols-3 gap-3 mb-5">
       <div>
        <label data-template-id="search-label" for="search" class="canva-text block mb-1"></label><input id="search">
       </div>
       <div>
        <label data-template-id="filter-label" for="filter-class" class="canva-text block mb-1"></label><select id="filter-class"><option value="">Semua kelas</option></select>
       </div>
       <div class="flex items-end">
        <button id="export-button" data-template-id="export-label" type="button" class="canva-button btn primary"></button>
       </div>
      </div>
      <div class="overflow-x-auto">
       <table class="w-full min-w-[680px] text-left">
        <thead>
         <tr class="border-b-2 border-[#d7e1d2]">
          <th class="p-3">Nama</th>
          <th class="p-3">Kelas</th>
          <th class="p-3">No. absen</th>
          <th class="p-3">Bagian</th>
          <th class="p-3">Kemajuan</th>
          <th class="p-3">Nilai</th>
          <th class="p-3">Status</th>
         </tr>
        </thead>
        <tbody id="student-rows"></tbody>
       </table>
      </div>
      <p id="dashboard-empty" data-template-id="dashboard-empty-label" class="canva-text py-7 text-center" hidden></p>
     </div>
    </section>
   </main>
   <footer class="max-w-6xl mx-auto px-5 pb-7">
    <span data-template-id="footer-text" class="canva-footer"></span>
   </footer>
  </div>
  <script>
(() => {
  const $ = id => document.getElementById(id);
  const sections = ['welcome','goals','aperception','introduction','material','example','guided','application','assessment','reflection','completion'];
  const stamp = () => new Date().toISOString();
  const details = row => { try { return JSON.parse(row?.activity_scores || '{}'); } catch { return {}; } };
  let rows = [], student = null, step = 0, ready = false, busy = false, dashboardOpen = false;
  function notice(message) { $('notice').textContent = message; $('notice').hidden = false; }
  function clearNotice() { $('notice').hidden = true; }
  function showScreen(name) {
    $('login-screen').hidden = name !== 'login';
    $('learning-screen').hidden = name !== 'learning';
    $('dashboard').hidden = name !== 'dashboard';
    dashboardOpen = name === 'dashboard';
    clearNotice();
    if (dashboardOpen) renderDashboard();
  }
  const handler = { onDataChanged(data) {
    rows = data;
    if (student && !busy) student = rows.find(row => row.__backendId === student.__backendId) || student;
    if (dashboardOpen) renderDashboard();
  }};
  async function initialize() {
    try {
      const result = await window.dataSdk.init(handler);
      ready = result.isOk;
      if (!ready) notice('Canva Sheet belum terhubung. Muat ulang halaman dan coba lagi.');
    } catch { notice('Canva Sheet belum terhubung. Muat ulang halaman dan coba lagi.'); }
    $('login-submit').disabled = !ready;
  }
  async function save(changes) {
    if (!student || !ready || busy) return false;
    busy = true;
    const updated = {...student, ...changes, last_activity:stamp()};
    try {
      const result = await window.dataSdk.update(updated);
      if (!result.isOk) { notice('Perubahan belum tersimpan. Coba lagi.'); return false; }
      student = updated;
      return true;
    } catch { notice('Koneksi terputus. Perubahan belum tersimpan.'); return false; }
    finally { busy = false; }
  }
  function renderStep() {
    const state = details(student);
    document.querySelectorAll('.lesson-view').forEach(view => view.hidden = view.id !== sections[step]);
    $('greeting').textContent = 'Selamat belajar, ' + student.nama;
    $('welcome-name').textContent = 'Selamat datang, ' + student.nama + '!';
    $('position').textContent = `Langkah ${step + 1} dari ${sections.length} · ${sections[step]}`;
    const material = Math.min(100, Math.round(Math.min(step, 6) / 6 * 100));
    const activity = (state.guided_0 ? 40 : 0) + (state.guided_1 ? 40 : 0) + (state.project ? 20 : 0);
    const evaluation = state.evaluated ? 100 : 0;
    [['material',material],['activity',activity],['evaluation',evaluation]].forEach(([name,value]) => {
      $(name + '-value').textContent = value + '%';
      $(name + '-bar').style.width = value + '%';
    });
    $('back-button').disabled = step === 0;
    $('next-button').hidden = step === sections.length - 1;
    $('next-button').disabled = (step === 6 && !(state.guided_0 && state.guided_1)) ||
      (step === 7 && !state.project) || (step === 8 && !state.evaluated) ||
      (step === 9 && !student.completed_at);
    if (state.story) $('story-text').value = state.story;
    $('oral-done').checked = !!state.oral_done;
    if (state.project) {
      $('story-feedback').textContent = 'Cerita dan laporan latihan lisan tersimpan. Kamu siap menuju evaluasi.';
      $('story-feedback').hidden = false;
    }
    if (state.evaluated) {
      const total = state.evaluation_total === 6 ? 6 : 3;
      $('assessment-result').textContent = `Skor ${student.eval_score}/${total} · Benar ${student.eval_score} · Salah ${total - student.eval_score} · ${student.eval_percentage}% · Evaluasi selesai.`;
      $('assessment-result').hidden = false;
      $('assessment-submit').disabled = true;
      $('assessment-form').querySelectorAll('input').forEach(input => input.disabled = true);
      $('completion-score').textContent = `Hasil evaluasi: ${student.eval_score}/${total} benar (${student.eval_percentage}%).`;
    }
    if (student.completed_at) {
      try {
        const answers = JSON.parse(student.reflection_text);
        if (Array.isArray(answers)) answers.slice(0,5).forEach((answer,i) => $('reflection-' + (i+1)).value = answer);
      } catch { $('reflection-1').value = student.reflection_text || ''; }
      $('reflection-form').querySelectorAll('textarea,button').forEach(control => control.disabled = true);
    }
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function enterStudent() {
    step = Math.max(0, sections.indexOf(student.current_section));
    showScreen('learning');
    renderStep();
  }
  $('login-form').addEventListener('submit', async event => {
    event.preventDefault();
    if (!ready || busy) return;
    const nama = $('student-name').value.trim(), kelas = $('student-class').value.trim(), nomor_absen = $('student-number').value.trim();
    if (!nama || !kelas || !/^[0-9]+$/.test(nomor_absen)) return;
    clearNotice();
    $('login-submit').disabled = true;
    const found = rows.find(row => row.nama?.trim().toLowerCase() === nama.toLowerCase() &&
      row.kelas?.trim().toLowerCase() === kelas.toLowerCase() && row.nomor_absen === nomor_absen);
    try {
      if (found) {
        student = found;
        const state = details(found);
        if (!await save({activity_scores:JSON.stringify({...state, last_login:stamp()})})) return;
      } else {
        if (rows.length >= 999) { notice('Batas 999 siswa tercapai. Hubungi guru.'); return; }
        busy = true;
        const result = await window.dataSdk.create({
          nama,kelas,nomor_absen,current_section:'welcome',progress_percentage:0,status:'belajar',
          activity_scores:JSON.stringify({created_at:stamp(),last_login:stamp()}),
          eval_score:0,eval_percentage:0,reflection_response:'',reflection_text:'',
          last_activity:stamp(),completed_at:''
        });
        busy = false;
        if (!result.isOk) { notice('Identitas belum tersimpan. Coba lagi.'); return; }
        student = rows.find(row => row.nama === nama && row.kelas === kelas && row.nomor_absen === nomor_absen);
        if (!student) { notice('Data sedang disinkronkan. Tunggu sebentar lalu masuk kembali.'); return; }
      }
      enterStudent();
    } catch { busy = false; notice('Tidak dapat melanjutkan. Periksa koneksi dan coba lagi.'); }
    finally { $('login-submit').disabled = !ready; }
  });
  async function move(delta) {
    if (busy || (delta > 0 && $('next-button').disabled)) return;
    const target = Math.max(0, Math.min(sections.length - 1, step + delta));
    if (target === step) return;
    $('next-button').disabled = true;
    $('back-button').disabled = true;
    if (await save({
      current_section:sections[target],
      progress_percentage:Math.max(Number(student.progress_percentage) || 0, Math.round(target / (sections.length - 1) * 100))
    })) step = target;
    renderStep();
  }
  $('back-button').addEventListener('click', () => move(-1));
  $('next-button').addEventListener('click', () => move(1));
  const guidedKey = [1,0];
  const feedback = [
    ['Tepat. Jam yang berhenti menimbulkan masalah; itulah komplikasi.','Coba lagi. Cari peristiwa yang memunculkan masalah.'],
    ['Tepat. Rani membantu meski takut, sehingga ia tampak berani dan peduli.','Coba lagi. Simpulkan sifat Rani dari tindakannya.']
  ];
  document.querySelectorAll('.choice').forEach(button => button.addEventListener('click', async () => {
    if (!student || busy) return;
    const q = Number(button.dataset.q), right = Number(button.dataset.a) === guidedKey[q];
    document.querySelectorAll(`.choice[data-q="${q}"]`).forEach(item => item.classList.toggle('selected',item === button));
    $('feedback-' + q).textContent = feedback[q][right ? 0 : 1];
    $('feedback-' + q).hidden = false;
    const state = details(student);
    state['attempts_' + q] = (state['attempts_' + q] || 0) + 1;
    if (right) state['guided_' + q] = true;
    const controls = [...document.querySelectorAll(`.choice[data-q="${q}"]`)];
    controls.forEach(item => item.disabled = true);
    if (await save({activity_scores:JSON.stringify(state)})) renderStep();
    controls.forEach(item => item.disabled = false);
  }));
  $('story-form').addEventListener('submit', async event => {
    event.preventDefault();
    if (!student || busy) return;
    const story = $('story-text').value.trim();
    if (!$('oral-done').checked) {
      $('story-feedback').textContent = 'Ceritakan kembali kisahmu dengan suara lantang, lalu centang bahwa kamu telah mencobanya.';
      $('story-feedback').hidden = false; return;
    }
    if (story.split(/[.!?]+/).filter(part => part.trim()).length < 3) {
      $('story-feedback').textContent = 'Tambahkan setidaknya tiga kalimat: pembuka, masalah, dan penyelesaian.';
      $('story-feedback').hidden = false; return;
    }
    const state = details(student);
    Object.assign(state,{story,oral_done:true,project:true,project_completed_at:stamp()});
    $('story-save').disabled = true;
    if (await save({activity_scores:JSON.stringify(state)})) renderStep();
    $('story-save').disabled = false;
  });
  $('assessment-form').addEventListener('submit', async event => {
    event.preventDefault();
    if (!student || busy || details(student).evaluated) return;
    const form = new FormData(event.currentTarget), key = [1,2,0,3,1,2];
    if (key.some((_,i) => form.get('q' + i) === null)) return;
    const score = key.reduce((sum,answer,i) => sum + (Number(form.get('q' + i)) === answer ? 1 : 0),0);
    const state = details(student);
    Object.assign(state,{evaluated:true,evaluation_total:6,evaluation_submitted_at:stamp()});
    $('assessment-submit').disabled = true;
    if (await save({eval_score:score,eval_percentage:Math.round(score / 6 * 100),activity_scores:JSON.stringify(state)})) renderStep();
    else $('assessment-submit').disabled = false;
  });
  $('reflection-form').addEventListener('submit', async event => {
    event.preventDefault();
    if (!student || busy) return;
    const answers = Array.from({length:5},(_,i) => $('reflection-' + (i+1)).value.trim());
    if (answers.some(answer => answer.length < 5)) return;
    $('reflection-submit').disabled = true;
    if (await save({
      reflection_response:'Lima pertanyaan dijawab',
      reflection_text:JSON.stringify(answers),
      status:'selesai',progress_percentage:100,completed_at:stamp(),current_section:'completion'
    })) { step = 10; renderStep(); }
    else $('reflection-submit').disabled = false;
  });
  function filtered() {
    const query = $('search').value.trim().toLowerCase(), kelas = $('filter-class').value;
    return rows.filter(row => (!query || `${row.nama} ${row.nomor_absen}`.toLowerCase().includes(query)) &&
      (!kelas || row.kelas === kelas));
  }
  function renderDashboard() {
    const classes = [...new Set(rows.map(row => row.kelas).filter(Boolean))].sort();
    const select = $('filter-class'), selected = select.value;
    if (classes.join('|') !== [...select.options].slice(1).map(option => option.value).join('|')) {
      select.replaceChildren(new Option('Semua kelas',''),...classes.map(kelas => new Option(kelas,kelas)));
      select.value = classes.includes(selected) ? selected : '';
    }
    const evaluated = rows.filter(row => details(row).evaluated);
    $('total-stat').textContent = rows.length;
    $('active-stat').textContent = rows.filter(row => row.status !== 'selesai').length;
    $('finished-stat').textContent = rows.filter(row => row.status === 'selesai').length;
    $('average-stat').textContent = evaluated.length ?
      Math.round(evaluated.reduce((sum,row) => sum + (Number(row.eval_percentage) || 0),0) / evaluated.length) + '%' : '—';
    const visible = filtered(), body = $('student-rows');
    const old = new Map([...body.children].map(tr => [tr.dataset.id,tr]));
    visible.forEach(row => {
      let tr = old.get(row.__backendId);
      if (!tr) {
        tr = document.createElement('tr'); tr.dataset.id = row.__backendId;
        tr.className = 'border-b border-[#e6eae2]';
        for (let i = 0; i < 7; i++) { const td = document.createElement('td'); td.className = 'p-3'; tr.appendChild(td); }
      }
      old.delete(row.__backendId);
      const values = [row.nama,row.kelas,row.nomor_absen,row.current_section,
        (row.progress_percentage || 0) + '%',
        details(row).evaluated ? row.eval_percentage + '%' : '—',
        row.status === 'selesai' ? 'Selesai' : 'Belajar'];
      [...tr.children].forEach((td,i) => { if (td.textContent !== String(values[i] ?? '')) td.textContent = values[i] ?? ''; });
      body.appendChild(tr);
    });
    old.forEach(tr => tr.remove());
    $('dashboard-empty').hidden = visible.length > 0;
  }
  $('dashboard-open').addEventListener('click', () => showScreen('dashboard'));
  $('dashboard-back').addEventListener('click', () => {
    showScreen(student ? 'learning' : 'login');
    if (student) renderStep();
  });
  $('search').addEventListener('input',renderDashboard);
  $('filter-class').addEventListener('change',renderDashboard);
  $('export-button').addEventListener('click', () => {
    const visible = filtered();
    if (!visible.length) { notice('Tidak ada data untuk diekspor.'); return; }
    const table = [['Nama','Kelas','Nomor absen','Bagian','Kemajuan','Nilai','Status'],
      ...visible.map(row => [row.nama,row.kelas,row.nomor_absen,row.current_section,row.progress_percentage,
        details(row).evaluated ? row.eval_percentage : '',row.status])];
    const csv = '\uFEFF' + table.map(line => line.map(value => '"' +
      String(value ?? '').replaceAll('"','""') + '"').join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    const link = document.createElement('a');
    link.href = url; link.download = 'kemajuan-cerita-fantasi.csv'; link.click();
    setTimeout(() => URL.revokeObjectURL(url),1000);
  });
  initialize();
})();
</script>
 </body>
</html>
